
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login | TOHEEED AGRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f2;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-box {
  background: white;
  width: 100%;
  max-width: 440px;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 5px 25px #00000015;
}
.logo {
  text-align: center;
  color: #123c2b;
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 8px;
}
.subtitle { text-align: center; color: #777; margin-bottom: 25px; }
.tabs { display: flex; gap: 10px; margin-bottom: 22px; }
.tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid #17613f;
  background: white;
  color: #17613f;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}
.tabs button.active { background: #17613f; color: white; }
label { display: block; margin: 15px 0 7px; font-weight: bold; color: #333; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}
.main-btn {
  width: 100%;
  padding: 14px;
  background: #17613f;
  color: white;
  border: none;
  border-radius: 6px;
  margin-top: 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.google-btn {
  width: 100%;
  padding: 13px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  margin-top: 15px;
  font-size: 15px;
  cursor: pointer;
}
.divider { text-align: center; color: #888; margin: 18px 0 5px; }
#message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #17613f;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.back {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #17613f;
  text-decoration: none;
}
[hidden] { display: none !important; }
button:disabled { opacity: 0.6; cursor: wait; }
</style>
</head>

<body>
<div class="login-box">
  <div class="logo">TOHEEED AGRO</div>
  <p class="subtitle">Customer Account Portal</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">Login</button>
    <button id="signupTab" type="button">Create Account</button>
  </div>

  <form id="loginForm">
    <div id="nameField" hidden>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your full name">
    </div>

    <label for="email">Email Address</label>
    <input type="email" id="email" required placeholder="Enter your email">

    <label for="password">Password</label>
    <input type="password" id="password" required minlength="6" placeholder="Enter your password">

    <button class="main-btn" id="submitBtn" type="submit">Login</button>
  </form>

  <div class="divider">OR</div>

  <button class="google-btn" id="googleBtn" type="button">
    Continue with Google
  </button>

  <div id="message" role="status"></div>
  <a href="index.html" class="back">← Back to Home</a>
</div>

<script>
const SUPABASE_URL = "https://slglavmmiqojtvguxijc.supabase.co";
const SUPABASE_KEY = "sb_publishable_YI7H95rmI26H02gzazmvHQ_gCW3SIcj";

const LOGIN_URL =
  "https://worldwideesportsnews.github.io/tohid-agro-spare-parts/login.html";

const DASHBOARD_URL =
  "https://worldwideesportsnews.github.io/tohid-agro-spare-parts/customer-dashboard.html";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      flowType: "pkce",
      detectSessionInUrl: false,
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

const loginForm = document.getElementById("loginForm");
const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const nameField = document.getElementById("nameField");
const fullNameInput = document.getElementById("fullName");
const submitBtn = document.getElementById("submitBtn");
const googleBtn = document.getElementById("googleBtn");
const message = document.getElementById("message");

let signupMode = false;
let redirecting = false;

function showMessage(text) {
  message.textContent = text;
}

function goToDashboard() {
  if (redirecting) return;
  redirecting = true;
  showMessage("Login successful. Opening your dashboard...");
  window.location.replace(DASHBOARD_URL);
}

loginTab.addEventListener("click", () => {
  signupMode = false;
  nameField.hidden = true;
  fullNameInput.required = false;
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
  submitBtn.textContent = "Login";
  showMessage("");
});

signupTab.addEventListener("click", () => {
  signupMode = true;
  nameField.hidden = false;
  fullNameInput.required = true;
  loginTab.classList.remove("active");
  signupTab.classList.add("active");
  submitBtn.textContent = "Create Account";
  showMessage("");
});

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  submitBtn.disabled = true;
  showMessage("Please wait...");

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (signupMode) {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullNameInput.value.trim() },
          emailRedirectTo: DASHBOARD_URL
        }
      });

      if (error) throw error;

      if (data.session) {
        goToDashboard();
      } else {
        showMessage("Account created. Please check your email to confirm your account.");
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      if (data.session) goToDashboard();
    }
  } catch (error) {
    showMessage(error.message);
  } finally {
    submitBtn.disabled = false;
  }
});

googleBtn.addEventListener("click", async () => {
  googleBtn.disabled = true;
  showMessage("Connecting to Google...");

  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: LOGIN_URL
      }
    });

    if (error) throw error;
  } catch (error) {
    showMessage("Google login error: " + error.message);
    googleBtn.disabled = false;
  }
});

async function initializeLogin() {
  const params = new URLSearchParams(window.location.search);
  const oauthError = params.get("error_description") || params.get("error");

  if (oauthError) {
    showMessage("Google authentication error: " + oauthError);
    return;
  }

  const code = params.get("code");

  if (code) {
    showMessage("Completing Google sign-in...");

    try {
      const { data, error } =
        await supabaseClient.auth.exchangeCodeForSession(code);

      if (error) throw error;

      if (data.session) {
        window.history.replaceState({}, document.title, LOGIN_URL);
        goToDashboard();
        return;
      }

      showMessage("Google sign-in did not return a session. Please try again.");
    } catch (error) {
      showMessage("Authentication error: " + error.message);
    }

    return;
  }

  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    showMessage(error.message);
    return;
  }

  if (data.session) goToDashboard();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_IN" && session) {
    goToDashboard();
  }
});

initializeLogin();
</script>
</body>
</html>
