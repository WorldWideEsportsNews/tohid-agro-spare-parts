
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spare Parts Catalogue | TOHEEED AGRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f5;color:#222}
header{background:#123d27;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h2{margin:0}
header a{color:white;text-decoration:none;margin:7px}
.hero{text-align:center;background:#1d5937;color:white;padding:40px 15px}
.container{max-width:1100px;margin:25px auto;padding:15px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select,textarea{padding:12px;border:1px solid #ccc;border-radius:7px;font-size:15px;width:100%;margin:6px 0 14px}
.tools input{flex:1;min-width:200px}
button{border:0;padding:12px 16px;border-radius:7px;cursor:pointer;font-weight:bold}
.green{background:#176b39;color:white}
.dark{background:#333;color:white}
.orange{background:#e58b16;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:165px;object-fit:cover;border-radius:8px;background:#eee}
.card h3{margin-bottom:7px}
.card p{color:#666;min-height:35px}
.card button{width:100%;margin-top:8px}
.panel{background:white;padding:22px;border-radius:12px;margin-top:25px;box-shadow:0 3px 12px #0001}
.cart-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding:12px 0;flex-wrap:wrap}
.cart-item input{width:75px;margin:0}
.hidden{display:none}
footer{text-align:center;padding:25px;background:#123d27;color:white;margin-top:35px}
</style>
</head>
<body>

<header>
<h2>TOHEEED AGRO SPARE PARTS</h2>
<nav>
<a href="index.html">Home</a>
<a href="login.html">Customer Login</a>
<a href="#cart">My Cart (<span id="cartCount">0</span>)</a>
</nav>
</header>

<section class="hero">
<h1>Spare Parts Catalogue</h1>
<p>Find the parts you need for your agricultural machinery.</p>
</section>

<div class="container">

<div class="tools">
<input id="search" placeholder="Search bolts, belts, bearings...">
<select id="category">
<option value="">All Categories</option>
</select>
</div>

<div id="products" class="products">Loading spare parts...</div>

<div class="panel" id="cart">
<h2>My Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<h3 id="cartTotal"></h3>
<button class="green" onclick="showCheckout()">Proceed to Checkout</button>
</div>

<div class="panel hidden" id="checkout">
<h2>Customer Details</h2>

<label>Full Name</label>
<input id="customerName" placeholder="Your full name" required>

<label>Phone Number</label>
<input id="customerPhone" placeholder="Your phone number" required>

<label>Delivery Address</label>
<textarea id="customerAddress" placeholder="Enter your complete address" required></textarea>

<label>Additional Notes</label>
<textarea id="customerNotes" placeholder="Optional notes"></textarea>

<button class="green" onclick="placeOrder('website')">Place Website Order</button>
<button class="orange" onclick="placeOrder('whatsapp')">Send Order on WhatsApp</button>
<p id="checkoutMessage"></p>
</div>

</div>

<footer>
<p>TOHEEED AGRO SPARE PARTS</p>
<p>WhatsApp: +92 333 4246467</p>
</footer>

<script>
const SUPABASE_URL = "https://slglavmmiqojtvguxijc.supabase.co";
const SUPABASE_KEY = "sb_publishable_YI7H95rmI26H02gzazmvHQ_gCW3SIcj";
const WHATSAPP_NUMBER = "923334246467";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allProducts = [];
let cart = [];

async function loadProducts(){
 const {data,error}=await db.from("products")
   .select("id,name,category,description,image_url")
   .eq("is_active",true)
   .order("name");

 if(error){
   document.getElementById("products").textContent="Could not load parts: "+error.message;
   return;
 }

 allProducts=data||[];

 const categories=[...new Set(allProducts.map(p=>p.category).filter(Boolean))];
 document.getElementById("category").innerHTML=
 '<option value="">All Categories</option>'+
 categories.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");

 renderProducts();
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function renderProducts(){
 const search=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("category").value;

 const filtered=allProducts.filter(p=>
   (p.name+" "+(p.description||"")+" "+p.category).toLowerCase().includes(search)
   &&(!category||p.category===category)
 );

 const box=document.getElementById("products");

 if(!filtered.length){
   box.textContent="No spare parts found.";
   return;
 }

 box.innerHTML=filtered.map(p=>`
 <div class="card">
 ${p.image_url
   ?`<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}">`
   :`<div style="height:165px;background:#eee;display:grid;place-items:center">No Photo</div>`}
 <h3>${escapeHTML(p.name)}</h3>
 <small>${escapeHTML(p.category)}</small>
 <p>${escapeHTML(p.description||"Contact us for details.")}</p>
 <button class="green" onclick="addToCart('${p.id}')">Add to Cart</button>
 </div>`).join("");
}

window.addToCart=function(id){
 const product=allProducts.find(p=>p.id===id);
 if(!product)return;

 const existing=cart.find(i=>i.id===id);
 if(existing)existing.quantity++;
 else cart.push({id, name:product.name, quantity:1});

 renderCart();
 document.getElementById("cart").scrollIntoView({behavior:"smooth"});
};

function renderCart(){
 document.getElementById("cartCount").textContent=
 cart.reduce((sum,i)=>sum+i.quantity,0);

 const box=document.getElementById("cartItems");

 if(!cart.length){
   box.textContent="Your cart is empty.";
   document.getElementById("cartTotal").textContent="";
   return;
 }

 box.innerHTML=cart.map(i=>`
 <div class="cart-item">
 <strong>${escapeHTML(i.name)}</strong>
 <input type="number" min="1" max="1000" value="${i.quantity}"
 onchange="changeQuantity('${i.id}',this.value)">
 <button class="dark" onclick="removeItem('${i.id}')">Remove</button>
 </div>`).join("");

 document.getElementById("cartTotal").textContent=
 "Items: "+cart.reduce((sum,i)=>sum+i.quantity,0);
}

window.changeQuantity=function(id,value){
 const item=cart.find(i=>i.id===id);
 if(!item)return;
 const quantity=Math.max(1,Math.min(1000,parseInt(value)||1));
 item.quantity=quantity;
 renderCart();
};

window.removeItem=function(id){
 cart=cart.filter(i=>i.id!==id);
 renderCart();
};

window.showCheckout=function(){
 if(!cart.length){
   alert("Please add a spare part to your cart first.");
   return;
 }
 document.getElementById("checkout").classList.remove("hidden");
 document.getElementById("checkout").scrollIntoView({behavior:"smooth"});
};

window.placeOrder=async function(source){
 if(!cart.length){
   alert("Your cart is empty.");
   return;
 }

 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();
 const notes=document.getElementById("customerNotes").value.trim();
 const msg=document.getElementById("checkoutMessage");

 if(name.length<2||phone.length<5||address.length<5){
   msg.textContent="Please complete your name, phone number and address.";
   return;
 }

 const items=cart.map(i=>({
   product_id:i.id,
   quantity:i.quantity
 }));

 const button=event?.currentTarget;
 if(button)button.disabled=true;
 msg.textContent="Submitting your order...";

 try{
   const {data,error}=await db.rpc("place_customer_order",{
     p_customer_name:name,
     p_phone:phone,
     p_address:address,
     p_notes:notes,
     p_order_source:source,
     p_items:items
   });

   if(error)throw error;

   const orderNumber=data.order_number;

   if(source==="whatsapp"){
     const lines=cart.map(i=>`${i.name} x ${i.quantity}`).join("\n");
     const text=
       `NEW ORDER #${orderNumber}\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nItems:\n${lines}\nNotes: ${notes}`;
     window.open(
       "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(text),
       "_blank"
     );
   }

   msg.textContent="Order #"+orderNumber+" submitted successfully!";
   cart=[];
   renderCart();

 }catch(error){
   msg.textContent="Order error: "+error.message;
 }finally{
   if(button)button.disabled=false;
 }
};

document.getElementById("search").addEventListener("input",renderProducts);
document.getElementById("category").addEventListener("change",renderProducts);

loadProducts();
</script>
</body>
</html>
