
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | TOHEEED AGRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f1;color:#222}
header{background:#123d27;color:white;padding:20px}
header h2{margin:0}
.container{max-width:1100px;margin:25px auto;padding:15px}
.panel{background:white;padding:22px;border-radius:12px;margin-bottom:22px;box-shadow:0 3px 12px #00000012}
h2,h3{margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccc;border-radius:7px;font-size:15px}
textarea{min-height:80px}
button{border:0;padding:11px 17px;border-radius:7px;cursor:pointer;font-weight:bold;margin:4px}
.primary{background:#176b39;color:white}
.secondary{background:#555;color:white}
.danger{background:#c62828;color:white}
.product{display:flex;gap:15px;align-items:center;border-bottom:1px solid #ddd;padding:15px 0;flex-wrap:wrap}
.product img{width:85px;height:85px;object-fit:cover;border-radius:8px;background:#eee}
.product-info{flex:1;min-width:180px}
#message{font-weight:bold;margin:12px 0}
#products{margin-top:15px}
small{color:#666}
</style>
</head>

<body>

<header>
<h2>TOHEEED AGRO SPARE PARTS</h2>
<p>Administrator Dashboard</p>
</header>

<div class="container">

<div class="panel">
<h2>Welcome, Administrator!</h2>
<p id="adminEmail">Checking account...</p>
<button class="secondary" onclick="window.location.href='index.html'">View Website</button>
<button class="danger" id="logoutBtn">Logout</button>
</div>

<div class="panel">
<h2 id="formTitle">Add New Spare Part</h2>

<form id="productForm">

<label>Product Name</label>
<input id="name" type="text" placeholder="Example: Tractor Piston" required>

<label>Category</label>
<select id="category" required>
<option value="">Select Category</option>
<option>Tractor Parts</option>
<option>Engine Parts</option>
<option>Hydraulic Parts</option>
<option>Bearings & Seals</option>
<option>Filters & Belts</option>
<option>Other Agricultural Parts</option>
</select>

<label>Description</label>
<textarea id="description" placeholder="Enter product details"></textarea>

<label>Price</label>
<input id="price" type="number" min="0" step="0.01" placeholder="Enter price" required>

<label>Stock Quantity</label>
<input id="stock" type="number" min="0" step="1" placeholder="Enter stock quantity" required>

<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">
<small>Choose a photo from your computer. Maximum recommended size: 5 MB.</small>

<div>
<button class="primary" type="submit" id="saveBtn">Save Product</button>
<button class="secondary" type="button" id="cancelBtn" style="display:none">Cancel Edit</button>
</div>

</form>

<div id="message"></div>
</div>

<div class="panel">
<h2>Manage Products</h2>
<button class="primary" id="refreshBtn">Refresh Products</button>
<div id="products">Loading products...</div>
</div>

</div>

<script>
const SUPABASE_URL = "https://slglavmmiqojtvguxijc.supabase.co";
const SUPABASE_KEY = "sb_publishable_YI7H95rmI26H02gzazmvHQ_gCW3SIcj";
const ADMIN_EMAIL = "huzaifahafeez743@gmail.com";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let editingId = null;
let currentImageUrl = null;

const form = document.getElementById("productForm");
const message = document.getElementById("message");
const productsDiv = document.getElementById("products");

function showMessage(text, success=false) {
    message.textContent = text;
    message.style.color = success ? "green" : "red";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

async function checkAdmin() {
    const { data, error } = await client.auth.getUser();

    if (error || !data.user) {
        window.location.href = "login.html";
        return false;
    }

    if ((data.user.email || "").toLowerCase() !== ADMIN_EMAIL) {
        document.body.innerHTML =
            "<h2 style='text-align:center;margin-top:100px'>Access Denied</h2>";
        return false;
    }

    document.getElementById("adminEmail").textContent = data.user.email;
    return true;
}

async function uploadPhoto(file) {
    if (!file) return currentImageUrl;

    if (!file.type.startsWith("image/")) {
        throw new Error("Please select an image file.");
    }

    if (file.size > 5 * 1024 * 1024) {
        throw new Error("Image must be smaller than 5 MB.");
    }

    const extension = file.name.split(".").pop().replace(/[^a-zA-Z0-9]/g, "");
    const fileName = crypto.randomUUID() + "." + extension;

    const { error } = await client.storage
        .from("product-images")
        .upload(fileName, file, {
            cacheControl: "3600",
            upsert: false
        });

    if (error) throw error;

    const { data } = client.storage
        .from("product-images")
        .getPublicUrl(fileName);

    return data.publicUrl;
}

async function loadProducts() {
    productsDiv.textContent = "Loading products...";

    const { data, error } = await client
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        productsDiv.textContent = "Error: " + error.message;
        return;
    }

    if (!data || data.length === 0) {
        productsDiv.textContent = "No products added yet.";
        return;
    }

    productsDiv.innerHTML = data.map(product => `
        <div class="product">
            ${product.image_url
                ? `<img src="${escapeHTML(product.image_url)}" alt="Product">`
                : `<div style="width:85px;height:85px;background:#eee;border-radius:8px;display:grid;place-items:center">No Photo</div>`
            }
            <div class="product-info">
                <strong>${escapeHTML(product.name)}</strong><br>
                <small>${escapeHTML(product.category)}</small><br>
                Price: ${escapeHTML(product.price)}<br>
                Stock: ${escapeHTML(product.stock)}
            </div>
            <div>
                <button class="primary" onclick="editProduct('${product.id}')">Edit</button>
                <button class="danger" onclick="deleteProduct('${product.id}')">Delete</button>
            </div>
        </div>
    `).join("");

    window.productRecords = data;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    showMessage("Please wait...");

    try {
        const file = document.getElementById("photo").files[0];
        const imageUrl = await uploadPhoto(file);

        const product = {
            name: document.getElementById("name").value.trim(),
            category: document.getElementById("category").value,
            description: document.getElementById("description").value.trim(),
            price: Number(document.getElementById("price").value),
            stock: Number(document.getElementById("stock").value),
            image_url: imageUrl,
            is_active: true
        };

        let result;

        if (editingId) {
            result = await client
                .from("products")
                .update(product)
                .eq("id", editingId);
        } else {
            result = await client
                .from("products")
                .insert(product);
        }

        if (result.error) throw result.error;

        showMessage(
            editingId ? "Product updated successfully!" : "Product added successfully!",
            true
        );

        resetForm();
        await loadProducts();

    } catch (error) {
        showMessage("Error: " + error.message);
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = editingId ? "Update Product" : "Save Product";
    }
});

window.editProduct = function(id) {
    const product = (window.productRecords || []).find(p => p.id === id);
    if (!product) return;

    editingId = id;
    currentImageUrl = product.image_url;

    document.getElementById("name").value = product.name;
    document.getElementById("category").value = product.category;
    document.getElementById("description").value = product.description || "";
    document.getElementById("price").value = product.price;
    document.getElementById("stock").value = product.stock;
    document.getElementById("photo").value = "";

    document.getElementById("formTitle").textContent = "Edit Product";
    document.getElementById("saveBtn").textContent = "Update Product";
    document.getElementById("cancelBtn").style.display = "inline-block";

    window.scrollTo({top: 0, behavior: "smooth"});
};

window.deleteProduct = async function(id) {
    if (!confirm("Are you sure you want to delete this product?")) return;

    const { error } = await client
        .from("products")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Delete failed: " + error.message);
        return;
    }

    alert("Product deleted successfully!");
    await loadProducts();
};

function resetForm() {
    form.reset();
    editingId = null;
    currentImageUrl = null;

    document.getElementById("formTitle").textContent = "Add New Spare Part";
    document.getElementById("saveBtn").textContent = "Save Product";
    document.getElementById("cancelBtn").style.display = "none";
}

document.getElementById("cancelBtn").addEventListener("click", resetForm);
document.getElementById("refreshBtn").addEventListener("click", loadProducts);

document.getElementById("logoutBtn").addEventListener("click", async function() {
    await client.auth.signOut();
    window.location.href = "login.html";
});

(async function startDashboard() {
    const allowed = await checkAdmin();
    if (allowed) await loadProducts();
})();
</script>

</body>
</html>
